<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>生物关系游戏（讲解版）</title>
    <style>
        body{font-family:Arial;text-align:center;background:#eef}
        .question{font-size:20px;margin:20px}
        button{padding:10px;margin:5px;font-size:20px}
        .correct{background:lightgreen}
        .wrong{background:salmon}
        #explain{margin:15px;font-size:16px}
    </style>
</head>

<body>
    <h2>🌱 生物之间的关系测验（即时讲解）</h2>
    <div id="timer">20</div>
    <div id="quiz"></div>
    <div id="explain"></div>

    <script>
        const questions=[
        {q:"同类动物竞争什么？",a:["食物、配偶等","音乐","电视"],c:0,e:"同类动物会争夺食物、配偶和地盘等资源。"},
        {q:"互利共生是？",a:["双方受益","一方受害","无影响"],c:0,e:"互利共生指双方都从关系中获益。"},
        {q:"共栖关系是？",a:["一方受益另一方无影响","双方受益","一方受害"],c:0,e:"共栖是一方获益，另一方既不受益也不受害。"},
        {q:"寄生关系是？",a:["一方受益一方受害","双方受益","无影响"],c:0,e:"寄生中寄生者获益，宿主受害。"},
        {q:"海葵和小丑鱼关系？",a:["互利共生","寄生","竞争"],c:0,e:"两者互相保护并获取食物，是互利共生。"},
        {q:"跳蚤属于？",a:["寄生","共生","竞争"],c:0,e:"跳蚤吸血，对宿主有害，属于寄生。"},
        {q:"植物竞争什么？",a:["阳光、水分","电视","手机"],c:0,e:"植物会争夺阳光、水分、空间和养分。"},
        {q:"寄生对宿主？",a:["有害","有益","无影响"],c:0,e:"寄生会伤害宿主，例如吸取营养。"},
        {q:"共栖对宿主？",a:["无影响","有害","有益"],c:0,e:"共栖中宿主通常不受影响。"},
        {q:"动物竞争地盘？",a:["是","否","不确定"],c:0,e:"动物会争夺地盘来生存和繁殖。"}
        ];
        
        let i=0,score=0,time=20,interval;
        
        function load(){
        if(i>=questions.length){
        let grade="E";
        if(score>84)grade="A";else if(score>68)grade="B";else if(score>52)grade="C";else if(score>36)grade="D";
        document.getElementById("quiz").innerHTML=`🎉完成！<br>分数:${score}<br>等级:${grade}<br><br><a href='https://forms.gle/4yrEaPsDNg9yVRzk9' target='_blank'>👉 点击这里填写你的分数 Click here to submit your score</a>`;
        document.getElementById("explain").innerHTML="";
        return;
        }
        let q=questions[i];
        let html=`<div class='question'>${i+1}. ${q.q}</div>`;
        q.a.forEach((opt,idx)=>{
        html+=`<button onclick='answer(${idx})'>${opt}</button>`;
        });
        document.getElementById("quiz").innerHTML=html;
        document.getElementById("explain").innerHTML="";
        time=20;
        }
        
        function answer(idx){
        clearInterval(interval);
        let q=questions[i];
        if(idx===q.c){
        score+=4;
        document.body.className='correct';
        document.getElementById("explain").innerHTML="✅ 正确！";
        }else{
        document.body.className='wrong';
        document.getElementById("explain").innerHTML="❌ 错误！讲解："+q.e;
        }
        setTimeout(()=>{document.body.className='';i++;load();start();},5000);
        }
        
        function start(){
        interval=setInterval(()=>{
        time--;
        document.getElementById("timer").innerText="⏳"+time;
        if(time<=0){clearInterval(interval);i++;load();start();}
        },1000);
        }
        
        load();start();
    </script>
</body>

</html>
