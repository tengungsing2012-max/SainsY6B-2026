<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>保护和复育游戏（双语随机版）</title>
    <style>
        body{font-family:Arial;text-align:center;background:#eef}
        .question{font-size:22px;margin:20px}
        button{font-size:22px;padding:10px;margin:5px}
        .correct{background:lightgreen}
        .wrong{background:salmon}
    </style>
</head>

<body>
    <h2>🌿 保护和复育测验（Bilingual Quiz）</h2>
    <div id="timer">⏳15</div>
    <div id="quiz"></div>
    <div id="explain"></div>

    <script>
        const questions=[
        {q:"什么是保护？ What is conservation?",a:["破坏环境 Destroy environment","保护生态环境 Protect environment","建房子 Build houses"],c:1,e:"保护是维持生态环境。"},
        {q:"复育是？ What is restoration?",a:["停止生长 Stop growth","帮助繁殖 Help reproduce","破坏生态 Destroy ecosystem"],c:1,e:"复育帮助濒危物种恢复。"},
        {q:"濒危是什么意思？ What is endangered?",a:["很多 Many","接近灭绝 Nearly extinct","没有变化 No change"],c:1,e:"濒危表示数量减少。"},
        {q:"绝种动物是？ What is extinct?",a:["新出现 New species","很多 Many","已经消失 Disappeared"],c:2,e:"绝种表示完全消失。"},
        {q:"保护方法？ Method?",a:["砍树 Cut trees","污染 Pollute","保护栖息地 Protect habitat"],c:2,e:"保护栖息地很重要。"},
        {q:"植树作用？",a:["减少空气 Reduce air","恢复生态 Restore ecosystem","污染 Pollute"],c:1,e:"植树改善环境。"},
        {q:"非法捕猎会？",a:["增加动物 Increase animals","减少动物 Reduce animals","无影响 No effect"],c:1,e:"捕猎减少数量。"},
        {q:"污染影响？",a:["帮助生物 Help organisms","伤害生物 Harm organisms","无影响 No effect"],c:1,e:"污染破坏生态。"},
        {q:"保护重要性？",a:["增加污染 Increase pollution","避免灭绝 Prevent extinction","减少资源 Reduce resources"],c:1,e:"保护防止灭绝。"},
        {q:"生态平衡？",a:["混乱 Chaos","稳定系统 Stable system","停止 Stop"],c:1,e:"生态需要稳定。"},
        {q:"资源持续利用？",a:["快速用完 Use quickly","浪费 Waste","长期使用 Long-term use"],c:2,e:"可持续使用资源。"},
        {q:"栖息地作用？",a:["破坏 Destroy","提供住所 Provide shelter","减少食物 Reduce food"],c:1,e:"提供生存空间。"},
        {q:"天灾影响？",a:["增加生物 Increase life","减少生物 Reduce life","无影响 No effect"],c:1,e:"破坏生态。"},
        {q:"开发土地？",a:["保护环境 Protect","无影响 No effect","破坏环境 Damage environment"],c:2,e:"过度开发不好。"},
        {q:"举报环保？",a:["无作用 No use","帮助保护 Help protect","破坏 Destroy"],c:1,e:"举报保护环境。"},
        {q:"复育目标？",a:["破坏 Destroy","恢复生态 Restore ecosystem","停止 Stop"],c:1,e:"恢复系统。"},
        {q:"保护环境能？",a:["破坏 Destroy","无作用 No effect","维持平衡 Maintain balance"],c:2,e:"维持生态。"},
        {q:"动物减少原因？",a:["帮助 Help","污染 Pollution","保护 Protect"],c:1,e:"污染减少数量。"},
        {q:"森林减少？",a:["无影响 No effect","增加动物 Increase animals","影响生态 Harm ecosystem"],c:2,e:"破坏环境。"},
        {q:"保护措施？",a:["污染 Pollute","植树 Plant trees","砍树 Cut trees"],c:1,e:"植树保护。"},
        {q:"生态系统？",a:["只有动物 Only animals","生物+环境 Living+environment","只有植物 Only plants"],c:1,e:"包含环境与生物。"},
        {q:"保护作用？",a:["减少生物 Reduce life","污染 Pollute","避免失去栖息地 Avoid habitat loss"],c:2,e:"保护栖息地。"},
        {q:"最终目标？",a:["停止 Stop","持续发展 Sustainable development","破坏 Destroy"],c:1,e:"目标是持续发展。"},
        {q:"保护可以？",a:["破坏 Destroy","维持资源 Maintain resources","无用 Useless"],c:1,e:"保护资源。"},
        {q:"为什么保护重要？",a:["浪费 Waste","无用 Useless","保持生态平衡 Keep balance"],c:2,e:"生态平衡重要。"}
        ];
        
        let i=0,score=0,time=15,interval;
        
        function load(){
        if(i>=questions.length){
        let grade="E";
        if(score>84)grade="A";else if(score>68)grade="B";else if(score>52)grade="C";else if(score>36)grade="D";
        document.getElementById("quiz").innerHTML=`🎉完成！<br>分数:${score}<br>等级:${grade}<br><br><a href='https://forms.gle/A9UjiuPHyAKeDcJ87' target='_blank'>👉 点击填写分数 Submit your score</a>`;
        document.getElementById("explain").innerHTML="";
        return;
        }
        let q=questions[i];
        let html=`<div class='question'>${i+1}. ${q.q}</div>`;
        q.a.forEach((opt,idx)=>{
        html+=`<button onclick='answer(${idx})'>${opt}</button>`;
        });
        
        document.getElementById("quiz").innerHTML=html;
        document.getElementById("explain").innerHTML="";
        time=15;
        }
        
        function answer(idx){
        clearInterval(interval);
        let q=questions[i];
        if(idx===q.c){score+=4;document.body.className='correct';document.getElementById("explain").innerHTML="✅ 正确 Correct";}
        else{document.body.className='wrong';document.getElementById("explain").innerHTML="❌ 错误 Wrong："+q.e;}
        setTimeout(()=>{document.body.className='';i++;load();start();},3000);
        }
        
        function start(){
        interval=setInterval(()=>{
        time--;
        document.getElementById("timer").innerText="⏳"+time;
        if(time<=0){clearInterval(interval);i++;load();start();}
        },1000);
        }
        
        load();start();
    </script>
</body>

</html>
